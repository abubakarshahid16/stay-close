name: Build iOS

# Proves the iOS app actually compiles, which nothing has ever checked.
#
# WHAT THIS DOES NOT DO, and cannot:
#
# It does not produce something an iPhone user can install. Apple permits
# installing an app only through the App Store, TestFlight, or ad-hoc
# provisioning with registered device UDIDs, and every one of those requires a
# paid Apple Developer Program membership and a signing certificate. There is no
# equivalent of sideloading an APK. A person with a Mac, Xcode and a free Apple
# ID can install onto their OWN device with a 7-day expiry, but that is not a
# link anyone can tap.
#
# So the honest iOS story stays: the web app, added to the Home Screen from
# Safari. That path is exercised on every push by the WebKit checks in
# deploy-web.yml.
#
# What this DOES do is make sure the iOS target is not quietly rotting. The
# project has iOS config (NSContactsUsageDescription, bundle identifier) that
# nothing has ever compiled, and a config-plugin change or a dependency bump can
# break the iOS build without touching Android. When an Apple account does
# appear, the difference between "add signing" and "start debugging" is whether
# this has been running.
#
# Built unsigned for the simulator, which is the only way to compile without a
# certificate.
#
# CURRENT STATE: FAILING, and the cause is upstream.
#
#   expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
#   error: 'RuntimeScheduler' cannot be annotated with either
#   SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED because it is not
#   returning a SWIFT_SHARED_REFERENCE type
#
# Established over five builds rather than assumed:
#
#   Xcode 16.4 (runner default)  package resolution fails - Swift 6.1, and
#                                Expo's `apple` package needs swift-tools 6.2
#   Xcode 26.0.1                 the interop errors above, PLUS eight
#                                "'weak' must be a mutable variable" errors
#   Xcode 26.3                   only the interop errors - closest to compiling
#   Release and Debug            identical, so not a build-settings choice
#
# expo-modules-jsi 57.0.5 is the latest published version, and it already fixed
# one Swift 6.2 incompatibility this project hit (abs() -> .magnitude). This one
# is not fixed yet. Nothing in this repository can resolve it: the failure is in
# a dependency's own C++ headers.
#
# This does not block anything shipping. Installing on an iPhone requires a paid
# Apple Developer account regardless, and the iPhone route today is the web app
# via Add to Home Screen, which IS verified on every push in WebKit.
# See docs/PLATFORM.md section 7.

# Weekly rather than per-push, because this is currently BLOCKED UPSTREAM and a
# workflow that always fails just teaches people to ignore failures. Weekly is
# enough to notice the week Expo or Xcode fixes it; dispatch is there for
# checking a fix immediately.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Compile for the simulator
    # macOS runners cost ten times a Linux minute, hence the path filter above.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # The runner default is not new enough. The first build failed with:
      #
      #   package 'apple' is using Swift tools version 6.2.0 but the installed
      #   version is 6.1.0
      #
      # Expo's `apple` Swift package declares swift-tools 6.2, which needs Xcode
      # 26 or newer. Selected dynamically rather than pinned, so this does not
      # rot the next time the runner image moves.
      # Xcode selection is narrower than it looks, and both directions failed.
      #
      # The runner default is 16.4, carrying Swift 6.1, and package resolution
      # fails outright:
      #
      #   package 'apple' is using Swift tools version 6.2.0 but the installed
      #   version is 6.1.0
      #
      # Picking the newest instead selected 26.3, which resolves packages and then
      # fails compiling Expo itself on stricter Swift/C++ interop:
      #
      #   'RuntimeScheduler' cannot be annotated with either SWIFT_RETURNS_RETAINED
      #   or SWIFT_RETURNS_UNRETAINED because it is not returning a
      #   SWIFT_SHARED_REFERENCE type
      #
      # Trying the oldest Xcode 26 instead was worse, not better: 26.0.1
      # produced the same interop errors PLUS a set of
      #
      #   'weak' must be a mutable variable, because it may change at runtime
      #
      # which newer Swift accepts. So the newest is the closest to compiling,
      # and the remaining blocker is the interop annotation above.
      #
      # Chosen by pattern rather than pinned to an exact build, so a runner
      # image refresh does not silently break it - and so this starts passing
      # on its own if a later Xcode or Expo release resolves the interop rule.
      - name: Select Xcode
        run: |
          echo "Xcode versions available:"
          ls -d /Applications/Xcode_*.app
      
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner. Expo SDK 57 needs Swift 6.2."
            exit 1
          fi
      
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "Selected: $XCODE"
          xcodebuild -version
          swift --version
      
      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      # The usage-description strings are a launch blocker on iOS: reading
      # contacts without NSContactsUsageDescription does not fail gracefully,
      # it terminates the app. Checked against the GENERATED Info.plist rather
      # than app.json, because that is what ships.
      - name: Verify the required usage descriptions
        run: |
          PLIST=ios/StayClose/Info.plist
          if [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -name 'Info.plist' -not -path '*/Pods/*' | head -1)
          fi
          echo "Using $PLIST"

          if ! /usr/libexec/PlistBuddy -c 'Print :NSContactsUsageDescription' "$PLIST" >/dev/null 2>&1; then
            echo "::error::NSContactsUsageDescription missing from $PLIST. iOS terminates the app on contact access without it."
            exit 1
          fi
          echo "NSContactsUsageDescription: $(/usr/libexec/PlistBuddy -c 'Print :NSContactsUsageDescription' "$PLIST")"

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Find the workspace and scheme
        id: xcode
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"

      # CODE_SIGNING_ALLOWED=NO is what makes this possible without a
      # certificate. A simulator build never needs one.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log | xcpretty || BUILD_FAILED=1

          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            echo "::group::xcodebuild output (tail)"
            tail -150 xcodebuild.log
            echo "::endgroup::"

            # Context, not just the marker line. "Could not resolve package
            # dependencies:" ends in a colon and the real reason is on the lines
            # AFTER it, so grepping for markers alone reports the category and
            # hides the cause - the same way the Gradle capture failed until it
            # was widened to a range.
            {
              grep -A 6 -E "Could not resolve package dependencies|xcodebuild: error" xcodebuild.log | head -40
              grep -E "error:|fatal error:|The following build commands failed" xcodebuild.log | head -20
            } > reason.txt || true

            [ -s reason.txt ] || tail -60 xcodebuild.log > reason.txt

            while IFS= read -r LINE; do
              CLEAN=$(printf %s "$LINE" | cut -c1-400)
              [ -n "$CLEAN" ] && echo "::error::${CLEAN}"
            done < reason.txt
            exit 1
          fi

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: xcodebuild.log
          retention-days: 7
