name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npx expo export --platform web
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'
          CI: '1'

      - name: Add PWA assets (manifest, icons, service worker)
        run: |
          # Icons are generated (not committed) — zero-dependency PNG encoder.
          node scripts/gen-icons.mjs
          cp public/sw.js dist/sw.js
          cp public/manifest.json dist/manifest.json
          mkdir -p dist/icons
          cp public/icons/*.png dist/icons/
          # Inject splash screen + install banner into the exported HTML.
          # Expo Router ignores web/index.html, so this must happen post-export.
          node scripts/inject-pwa.mjs
          # GitHub Pages serves 404.html for unknown paths -> SPA deep links work.
          cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
