name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: stay-close-key
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mv "${{ steps.sign.outputs.signedReleaseFile }}" stay-close-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stay Close ${{ github.ref_name }}
          body: |
            ## 📱 Install Stay Close ${{ github.ref_name }}

            ### Android
            1. **Download** `stay-close-${{ github.ref_name }}.apk` below
            2. Open the downloaded file on your Android phone
            3. If asked, allow **"Install unknown apps"** in Settings → your browser → Allow
            4. Tap **Install** — done!

            ### Web (laptop or phone browser)
            Visit: **https://${{ github.repository_owner }}.github.io/stay-close**

            ---
            🔒 **Privacy**: No internet permission. Your contacts never leave your device. No ads, no cloud, no tracking.
          files: stay-close-${{ github.ref_name }}.apk
