name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show available Android tools
        run: |
          echo "=== NDK versions ===" && ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "none"
          echo "=== CMake versions ===" && ls $ANDROID_HOME/cmake/ 2>/dev/null || echo "none"
          echo "=== SDK Root ===" && echo $ANDROID_HOME

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Patch gradle.properties for CI
        run: |
          cat >> android/gradle.properties << 'PROPS'
          newArchEnabled=false
          hermesEnabled=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          PROPS
          echo "--- gradle.properties ---"
          cat android/gradle.properties

      - name: Show build.gradle NDK version
        run: grep -r "ndkVersion" android/ || echo "no ndkVersion found"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Rename APK
        run: |
          find android/app/build/outputs/apk -name "*.apk" | head -5
          cp android/app/build/outputs/apk/debug/app-debug.apk stay-close-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stay Close ${{ github.ref_name }}
          body: |
            ## Install Stay Close ${{ github.ref_name }}

            ### Android — Direct Download
            1. [Download APK](https://github.com/abubakarshahid16/stay-close/releases/latest/download/stay-close-${{ github.ref_name }}.apk)
            2. Open the file on your Android phone
            3. Allow "Install unknown apps" if prompted
            4. Tap Install

            ### Web / iPhone
            https://abubakarshahid16.github.io/stay-close
          files: stay-close-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
