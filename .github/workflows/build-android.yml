name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Patch Android for CI
        run: |
          echo "=== NDK versions available ==="
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "none"
          NDK=$(ls "$ANDROID_HOME/ndk/" 2>/dev/null | sort -V | tail -1)
          echo "Using NDK: $NDK"
          if [ -n "$NDK" ]; then
            sed -i "s/ndkVersion \"[^\"]*\"/ndkVersion \"$NDK\"/" android/build.gradle
          else
            sed -i '/ndkVersion/d' android/build.gradle
          fi
          grep ndkVersion android/build.gradle || echo "ndkVersion removed"
          echo "newArchEnabled=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          tail -5 android/gradle.properties

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          [ -n "$APK" ] || { echo "No APK!"; exit 1; }
          cp "$APK" stay-close-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stay Close ${{ github.ref_name }}
          body: |
            ## Install Stay Close ${{ github.ref_name }}

            ### Android
            1. Download APK below
            2. Open on your Android phone
            3. Allow Install unknown apps if prompted
            4. Tap Install

            ### Web / iPhone
            https://abubakarshahid16.github.io/stay-close
            iPhone: Share then Add to Home Screen
          files: stay-close-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
