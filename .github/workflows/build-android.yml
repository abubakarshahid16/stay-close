name: Build Android APK

# Produces a directly-installable APK and attaches it to a GitHub Release, so
# the README install button has something to point at.
#
# Triggers:
#   - pushing a v*.*.* tag  -> publishes a Release
#   - manual dispatch       -> uploads a build artefact only, no Release
#
# This builds the RELEASE variant, signed with the standard Android debug key.
#
# It used to build the debug variant, and that APK was unusable: React Native
# only embeds the JS bundle for variants NOT listed in `debuggableVariants`,
# which defaults to ["debug"]. So the published APK contained no
# index.android.bundle at all — it installed, launched, and then showed
# "Unable to load script" because it was looking for a Metro dev server that
# does not exist on a user's phone. Verified by parsing the central directory
# of the published APK: 1327 entries, no bundle among them.
#
# The release variant embeds the bundle. Signing uses android/app/debug.keystore,
# which Expo's template ships as a fixed file rather than generating per run
# (verified: identical SHA-256 across a clean prebuild), so the signing identity
# is stable and in-place upgrades keep working. That key is public, so this is
# fine for direct install and NOT suitable for Play Store submission.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Fail before spending time on a native build if the project is broken.
      - name: Verify the project is sound
        run: |
          npm run lint
          npm run typecheck
          npm run test:all -- --ci

      - name: Generate native projects
        run: npx expo prebuild --platform android --clean

      # Output is captured so a failure can be surfaced as annotations by the
      # next step. Workflow logs need authentication to read, whereas
      # annotations are available on a public repo — without this, a Gradle
      # failure here is invisible to anyone without repo access, which is
      # exactly the position this build was in.
      - name: Build APK
        id: gradle
        working-directory: android
        run: |
          set -o pipefail
          # x86/x86_64 are emulator architectures. Shipping all four made the
          # APK 223 MB for a phone that can only ever use one of them.
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee gradle-output.txt

      - name: Surface the Gradle failure
        if: failure() && steps.gradle.outcome == 'failure'
        working-directory: android
        run: |
          echo "::group::Gradle output (tail)"
          tail -120 gradle-output.txt || true
          echo "::endgroup::"

          # Promote the failure into annotations, which are readable without
          # repo access. Gradle puts the reason on the lines AFTER "What went
          # wrong:", so grepping for the marker alone reports nothing useful —
          # capture the whole block.
          awk '/What went wrong:/,/^\* Try:/' gradle-output.txt > reason.txt || true
          # Metro failures are the important special case, and the block above
          # misses them completely. When JS bundling fails, Gradle reports only
          # "Process 'command 'node'' finished with non-zero exit value 1" and
          # names the task; the actual cause - an unresolvable module, a syntax
          # error - is printed by Metro much earlier in the log. That gap cost a
          # local reproduction to diagnose a one-line resolver error.
          grep -E "Unable to resolve module|SyntaxError|Bundling failed|Import stack" \
            gradle-output.txt | head -12 >> reason.txt || true

          grep -E "Caused by:|error:|Unsupported|Could not|Execution failed" gradle-output.txt \
            | head -20 >> reason.txt || true

          if [ ! -s reason.txt ]; then
            tail -60 gradle-output.txt > reason.txt
          fi

          while IFS= read -r LINE; do
            CLEAN=$(printf '%s' "$LINE" | tr -d '\r' | cut -c1-400)
            if [ -n "$CLEAN" ]; then
              echo "::error::${CLEAN}"
            fi
          done < <(head -40 reason.txt)

      - name: Upload the Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/gradle-output.txt
          retention-days: 7

      # THE release blocker for installability, and the reason v2.0.0-alpha.7
      # shipped an APK that could not start.
      #
      # React Native embeds the JS bundle only for variants that are not listed
      # in `debuggableVariants` (default: ["debug"]). Building the debug variant
      # therefore produced an APK with no index.android.bundle, which installs
      # perfectly and then fails at launch with "Unable to load script" because
      # it expects a Metro dev server. Nothing in the build fails when this
      # happens, which is why it went unnoticed through seven tags.
      - name: Verify the JS bundle is actually inside the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }

          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo "--- ABIs ---"
          unzip -l "$APK" | grep -oE 'lib/[^/]+' | sort -u || true

          if ! unzip -l "$APK" | grep -q 'assets/index.android.bundle'; then
            echo "::error::No index.android.bundle in the APK. It would install and then show 'Unable to load script'. Build the release variant, not debug."
            unzip -l "$APK" | grep 'assets/' || echo "(no assets/ entries at all)"
            exit 1
          fi

          BUNDLE_SIZE=$(unzip -l "$APK" | awk '/assets\/index.android.bundle/ {print $1}')
          echo "JS bundle embedded: ${BUNDLE_SIZE} bytes"
          if [ "${BUNDLE_SIZE:-0}" -lt 100000 ]; then
            echo "::error::JS bundle is only ${BUNDLE_SIZE} bytes - suspiciously small"
            exit 1
          fi

      # The permission audit's release blocker (docs/SECURITY.md section 3.5),
      # checked against the BUILT APK rather than the source manifest.
      #
      # The source manifest is not evidence: forbidden permissions legitimately
      # appear there carrying tools:node="remove" directives, and native library
      # manifests contribute their own entries only at Gradle merge time. The APK
      # is the only artefact reflecting what a user actually installs.
      - name: Verify permissions in the built APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found in the Android SDK"
            exit 1
          fi
          echo "Using $AAPT"

          # An ALLOWLIST, asserted against the exact set of <uses-permission>
          # entries. This used to be a blocklist of known-bad names, and that
          # is exactly how android.permission.READ_APP_BADGE shipped: a
          # dependency requested it, it was on nobody's forbidden list, and the
          # check passed. A blocklist can only catch what someone thought of.
          #
          # Only "uses-permission:" lines count. aapt also prints "permission:"
          # for permissions the app DECLARES and component-level protections
          # like BIND_JOB_SERVICE, which are not permissions the app requests.
          "$AAPT" dump permissions "$APK" > perms.txt
          grep -oE "^uses-permission: name='[^']+'" perms.txt \
            | sed -E "s/^uses-permission: name='//; s/'$//" | sort -u > requested.txt

          echo "--- permissions the APK requests ---"
          cat requested.txt
          echo "------------------------------------"

          # printf rather than a heredoc: a heredoc terminator has to sit at
          # column 0, which ends this YAML block scalar and breaks the file.
          # Built with echo rather than a heredoc or a line-continued printf:
          # a heredoc terminator must sit at column 0, which would end this
          # YAML block scalar, and a continued printf is easy to mangle.
          {
            echo 'android.permission.POST_NOTIFICATIONS'
            echo 'android.permission.READ_CONTACTS'
            echo 'android.permission.RECEIVE_BOOT_COMPLETED'
          } | sort -u > allowed.txt

          FAILED=0

          EXTRA=$(comm -23 requested.txt allowed.txt)
          if [ -n "$EXTRA" ]; then
            while IFS= read -r NAME; do
              [ -n "$NAME" ] && echo "::error::${NAME} is requested by the APK but is not justified. Add it to ALLOWED in plugins/withMinimalPermissions.js with a reason, or to REMOVE to strip it. See docs/SECURITY.md section 3."
            done <<< "$EXTRA"
            FAILED=1
          fi

          MISSING=$(comm -13 requested.txt allowed.txt)
          if [ -n "$MISSING" ]; then
            while IFS= read -r NAME; do
              [ -n "$NAME" ] && echo "::error::${NAME} is justified but missing from the APK. The app will not work without it."
            done <<< "$MISSING"
            FAILED=1
          fi

          if [ "$FAILED" = "0" ]; then
            echo "Exactly the three justified permissions, no others."
          fi

          exit $FAILED

      - name: Name the artefact
        id: name
        run: |
          VERSION=$(node -e "process.stdout.write(require('./app.json').expo.version)")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="stay-close-${{ github.ref_name }}.apk"
          else
            NAME="stay-close-v${VERSION}-${GITHUB_SHA:0:7}.apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.name.outputs.apk }}
          retention-days: 14

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
          name: Stay Close ${{ github.ref_name }}
          # Published as a normal release, and explicitly marked latest.
          #
          # Marking every build a pre-release was accurate about maturity and
          # actively harmful in practice. GitHub excludes pre-releases from
          # /releases/latest, so that URL resolved to the releases LIST rather
          # than a download, and with no release marked latest the list is
          # ordered lexicographically by tag - which put alpha.9 above alpha.10
          # and left the newest build at the bottom, below a broken one. A user
          # following the README's install button reached the wrong APK.
          #
          # "Latest" states which build is current, not that it is finished.
          # The maturity warnings stay in the release notes below and in the
          # README, where they are read rather than encoded in a flag.
          prerelease: false
          make_latest: true
          body: |
            ## Install on Android

            1. Download the `.apk` below on your phone.
            2. Open it. Android will ask you to allow installing from your browser — allow it once.
            3. Open Stay Close.

            **Android only.** iPhones cannot sideload; an iOS build needs TestFlight or the App Store.

            ### On first launch

            Grant **Contacts** so you can choose who to stay in touch with, and **Notifications** so
            reminders can reach you. Everything stays on your phone — no account, no server, and the
            app has no internet permission at all.

            ### Please read

            This is a **debug-signed** build for direct install, not a store release.

            **Not yet verified on real hardware.** Notification delivery with the app closed, reboot
            recovery and offline operation are specified in `docs/DEVICE_VERIFICATION.md` but have not
            been tested on a device. If reminders do not arrive when the app is closed, that is a
            known unverified area — please open an issue with your phone model and Android version.
