name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Patch Android project for CI
        run: |
          # Find the first installed NDK version and use it
          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ 2>/dev/null | sort -V | tail -1)
          echo "Using NDK: $NDK_VERSION"
          if [ -n "$NDK_VERSION" ]; then
            # Replace ndkVersion in build.gradle with the installed version
            sed -i "s/ndkVersion .*/ndkVersion "$NDK_VERSION"/" android/build.gradle || true
          fi

          # Append CI-friendly settings to gradle.properties
          cat >> android/gradle.properties << 'PROPS'
          newArchEnabled=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          PROPS

          echo "=== NDK available ===" && ls $ANDROID_HOME/ndk/ || true
          echo "=== ndkVersion in build.gradle ===" && grep ndkVersion android/build.gradle || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Find and copy APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $APK"
          cp "$APK" stay-close-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stay Close ${{ github.ref_name }}
          body: |
            ## 📱 Install Stay Close ${{ github.ref_name }}

            ### Android — Direct Download
            1. **[⬇️ Download APK](https://github.com/abubakarshahid16/stay-close/releases/latest/download/stay-close-${{ github.ref_name }}.apk)**
            2. Open the file on your Android phone
            3. Allow "Install unknown apps" if prompted (one-time only)
            4. Tap Install — done!

            ### Web / iPhone / iPad
            Open: **https://abubakarshahid16.github.io/stay-close**
            On iPhone: Share → Add to Home Screen

            ---
            🔒 No internet permission. Your contacts never leave your device.
          files: stay-close-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
