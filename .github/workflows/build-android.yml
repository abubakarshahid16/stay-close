name: Build Android APK

# Produces a directly-installable APK and attaches it to a GitHub Release, so
# the README install button has something to point at.
#
# Two triggers:
#   - pushing a v*.*.* tag  -> publishes a Release
#   - manual dispatch       -> uploads a build artefact only, no Release
#
# The APK is DEBUG-SIGNED on purpose. A release build needs a keystore, and a
# keystore generated per-run would change the signing identity every build,
# breaking in-place upgrades for anyone who had already installed it. A
# debug-signed APK sideloads fine, which is what "install directly from the
# repo" needs. It is not suitable for Play Store submission — that requires a
# stable keystore held in repository secrets.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Fail before spending time on a native build if the project is broken.
      - name: Verify the project is sound
        run: |
          npm run lint
          npm run typecheck
          npm run test:all -- --ci

      - name: Generate native projects
        run: npx expo prebuild --platform android --clean

      # The permission audit's release blocker (docs/SECURITY.md §3.5). The unit
      # tests cover the plugin's transform; only a real prebuild proves it
      # applied. A failure here must stop the build, not warn.
      - name: Verify permission allowlist applied
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "--- declared permissions ---"
          grep -o 'android.permission.[A-Z_]*' "$MANIFEST" | sort -u || true
          echo "----------------------------"

          FAILED=0
          for FORBIDDEN in INTERNET WRITE_CONTACTS READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
                           CALL_PHONE SCHEDULE_EXACT_ALARM USE_EXACT_ALARM ACCESS_FINE_LOCATION \
                           CAMERA RECORD_AUDIO; do
            if grep -q "android.permission.$FORBIDDEN" "$MANIFEST"; then
              echo "::error::$FORBIDDEN is present in the manifest. See docs/SECURITY.md §3."
              FAILED=1
            fi
          done

          for REQUIRED in READ_CONTACTS POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED; do
            if ! grep -q "android.permission.$REQUIRED" "$MANIFEST"; then
              echo "::error::$REQUIRED is missing from the manifest."
              FAILED=1
            fi
          done

          exit $FAILED

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the artefact
        id: name
        run: |
          VERSION=$(node -e "process.stdout.write(require('./app.json').expo.version)")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="stay-close-${{ github.ref_name }}.apk"
          else
            NAME="stay-close-v${VERSION}-${GITHUB_SHA::7}.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.name.outputs.apk }}
          retention-days: 14

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
          name: Stay Close ${{ github.ref_name }}
          body: |
            ## Install on Android

            1. Download the `.apk` below on your phone.
            2. Open it. Android will ask you to allow installing from your browser — allow it once.
            3. Open Stay Close.

            **Android only.** iOS cannot sideload; an iPhone build needs TestFlight or the App Store.

            ### Please read

            This is a **debug-signed** build for direct install, not a store release.

            On first launch, grant **Contacts** so you can choose who to stay in touch with, and
            **Notifications** so reminders can reach you. Everything stays on your phone — there
            is no account, no server, and the app has no internet permission at all.

            ### Not yet verified on real hardware

            Notification delivery with the app closed, reboot recovery, and offline operation are
            specified in `docs/DEVICE_VERIFICATION.md` but have **not** been tested on a device.
            If reminders do not arrive when the app is closed, that is a known unverified area —
            please open an issue with your phone model and Android version.
