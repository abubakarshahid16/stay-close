name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            --channel=0 || true

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Disable New Architecture (faster, more stable CI builds)
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/' android/gradle.properties || true
          echo "newArchEnabled=false" >> android/gradle.properties

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk stay-close-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stay Close ${{ github.ref_name }}
          body: |
            ## 📱 Install Stay Close ${{ github.ref_name }}

            ### Android — Direct Download
            1. **[⬇️ Download APK](https://github.com/abubakarshahid16/stay-close/releases/latest/download/stay-close-${{ github.ref_name }}.apk)**
            2. Open the file on your Android phone
            3. Allow **"Install unknown apps"** if prompted (one-time only)
            4. Tap **Install** — done!

            ### Web / iPhone / iPad
            Open in any browser: **https://abubakarshahid16.github.io/stay-close**
            On iPhone: Share → Add to Home Screen

            ---
            🔒 **Privacy**: No internet permission. Your contacts never leave your device.
          files: stay-close-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
