name: CI — Lint & Test

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings=0

      - name: Run unit tests
        run: npx jest --testPathPattern='__tests__/unit' --passWithNoTests --ci --forceExit
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Run component tests
        run: npx jest --testPathPattern='__tests__/components' --passWithNoTests --ci --forceExit
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Run database & integration tests
        run: npx jest --testPathPattern='__tests__/(db|integration)' --passWithNoTests --ci --runInBand --forceExit
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Coverage report (non-blocking)
        run: npx jest --testPathPattern='__tests__/(unit|components)' --passWithNoTests --coverage --forceExit
        continue-on-error: true
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
