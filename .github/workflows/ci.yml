name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Everything here is blocking. The previous config marked component tests
  # continue-on-error and never ran lint or the db suites at all, so a red
  # build could still look green (issue 005).
  verify:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Domain, application and simulation suites. No native or platform
      # dependency, so a failure here is always a real failure.
      - name: Unit tests
        run: npm test -- --ci

  adapters:
    name: Adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # better-sqlite3 is an optionalDependency needing a native toolchain.
      # It builds here on ubuntu; contributors without MSVC on Windows can
      # still run the unit project (docs/ARCHITECTURE.md §7).
      - name: Install dependencies
        run: npm ci

      # Forced explicitly: newer npm gates install scripts behind
      # allow-scripts, so relying on the implicit node-gyp run during install
      # is not safe. This must succeed here even though it cannot on a Windows
      # machine without MSVC.
      - name: Build native SQLite
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Verify native SQLite loads
        run: node -e "require('better-sqlite3'); console.log('better-sqlite3 OK')"

      - name: Adapter tests
        run: npm run test:adapters -- --ci --passWithNoTests
