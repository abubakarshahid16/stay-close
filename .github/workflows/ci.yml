name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Every step is blocking. The previous config never ran lint or the db suites
  # and marked component tests continue-on-error, so a red build could still
  # look green (issue 005).
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: the persistence suite uses the built-in node:sqlite, which is
      # unflagged from Node 23.4. This replaced better-sqlite3, so CI needs no
      # native build step at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:all -- --ci

      # Catches native-bundle breakage without an Android SDK or a 20-minute
      # APK build.
      #
      # This is here because a real bug reached seven released tags unseen:
      # AppContext imported the web SQLite driver alongside the native one and
      # chose between them with Platform.OS, which pulled sql.js — and its
      # `require("node:fs")` — into the Android dependency graph. Metro cannot
      # resolve node:fs for a native target, so the Android bundle could not be
      # built at all.
      #
      # Nothing caught it. Unit tests do not bundle, the web build resolves
      # sql.js perfectly well, and the APK workflow was building the debug
      # variant, which skips JS bundling entirely. The first build that
      # actually bundled for Android was the first one to fail.
      #
      # iOS is covered too, and needs it more: it is not built on every push,
      # and its native compile is blocked upstream (docs/PLATFORM.md 6.1), so
      # nothing else would notice the iOS graph breaking. A JS bundle needs no
      # Xcode, so it runs here on Linux in seconds. It also matters for the free
      # iPhone route, which runs this exact bundle inside Expo Go.
      - name: Bundle for Android and iOS
        run: npm run bundle:native
