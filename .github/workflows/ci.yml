name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Every step is blocking. The previous config never ran lint or the db suites
  # and marked component tests continue-on-error, so a red build could still
  # look green (issue 005).
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the persistence suite uses the built-in node:sqlite, which is
      # unflagged from Node 23.4. This replaced better-sqlite3, so CI needs no
      # native build step at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:all -- --ci
