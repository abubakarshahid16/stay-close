<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stay Close</title>
  <meta name="theme-color" content="#7C3AED" />
  <meta name="description" content="A private relationship reminder. No cloud, no tracking." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #F7F6FB; }

    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #F7F6FB;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .splash-icon {
      width: 80px; height: 80px;
      background: #7C3AED;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(124,58,237,0.25);
    }
    .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 26px; font-weight: 700;
      color: #1a1a2e; margin-bottom: 6px;
    }
    .splash-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; color: #888; margin-bottom: 40px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #E9E6F5;
      border-top-color: #7C3AED;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-icon">🤝</div>
    <div class="splash-title">Stay Close</div>
    <div class="splash-sub">Your private relationship reminder</div>
    <div class="spinner"></div>
  </div>

  <div id="root"></div>

  <script>
    // Hide splash once React has rendered something
    var observer = new MutationObserver(function() {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 500);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>
</body>
</html>
